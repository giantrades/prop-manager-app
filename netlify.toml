[build]
  command = "pnpm --frozen-lockfile build:all && node scripts/merge-builds.js"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  PNPM_VERSION = "9"

# Trading Journal FUNDIDO no main-app (Fase 5): /journal/* é servido pelo index.html
# do main-app (router único, client-side, sem reload). Sem redirect separado.

# Roteamento para SPA - Main App (deve ficar por último)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ── Cache (evita "versão velha" presa no navegador/SW) ──────────────────────
# Service worker NUNCA pode ser cacheado (senão o browser não pega update).
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# HTML sempre revalidado (referencia os chunks com hash novos).
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

# Assets com hash: cache imutável e longo.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Cross-Origin-Embedder-Policy = "credentialless"