[build]
  command = "pnpm --frozen-lockfile build:all && node scripts/merge-builds.js"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  PNPM_VERSION = "9"

# Trading Journal FUNDIDO no main-app (Fase 5): /journal/* é servido pelo index.html
# do main-app (router único, client-side, sem reload). Sem redirect separado.

# Roteamento para SPA - Main App (deve ficar por último)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

  # ✅ ADICIONE ESTAS LINHAS:
[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Cross-Origin-Embedder-Policy = "credentialless"