<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f1218" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Journal" />
    <link rel="manifest" href="/journal/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/journal/icons/icon-192.png" />
    <title>Trading Journal</title>
   <link rel="icon" type="image/png" href="./favicon32x32.png" />  
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("/journal/sw.js")
            .catch((err) => console.warn("[pwa] sw register:", err));
        });
      }
    </script>
  </body>
</html>
