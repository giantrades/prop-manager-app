<!doctype html>
<html lang="en">
  
  <head>
    <script src="https://apis.google.com/js/api.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f1218" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FinanceOS" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>Prop Manager</title>
  <link rel="icon" type="image/png" href="./favicon32x32.png" />  
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("/sw.js")
            .catch((err) => console.warn("[pwa] sw register:", err));
        });
      }
      // Auto-heal de cache velho: se o bundle em execução for de um build antigo (SW
      // controlando + hash do bundle diferente do último visto), desregistra o SW,
      // limpa os caches do app e recarrega UMA vez. Roda sempre com HTML fresco.
      (function () {
        try {
          var tag = document.querySelector('script[type="module"][src*="/assets/"]');
          var src = tag && tag.getAttribute("src");
          if (!src) return; // dev
          var seen = localStorage.getItem("sw:build");
          if (seen === src) return;
          // Sem SW controlando = primeira visita: só registra e segue (sem reload).
          if (!navigator.serviceWorker || !navigator.serviceWorker.controller) {
            localStorage.setItem("sw:build", src);
            return;
          }
          localStorage.setItem("sw:build", src);
          var last = Number(sessionStorage.getItem("sw:resetAt") || 0);
          if (Date.now() - last < 10 * 60 * 1000) return; // anti-loop
          sessionStorage.setItem("sw:resetAt", String(Date.now()));
          var done = function () { window.location.reload(); };
          var clearCaches = window.caches
            ? caches.keys().then(function (ks) {
                return Promise.all(
                  ks.filter(function (k) { return k.indexOf("financeos-") === 0; })
                    .map(function (k) { return caches.delete(k); }),
                );
              })
            : Promise.resolve();
          Promise.all([
            navigator.serviceWorker.getRegistrations().then(function (rs) {
              return Promise.all(rs.map(function (r) { return r.unregister(); }));
            }),
            clearCaches,
          ]).then(done, done);
        } catch (e) { /* noop */ }
      })();
    </script>
  </body>
</html>
